<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taekwondo Gym Sales Summary</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="/">หน้าหลัก</a></li>
            <li><a href="/role">การจัดการผู้ดูแล</a></li>
            <li><a href="/member">ข้อมูลนักกีฬา</a></li>
            <li><a href="/train">การจัดการผู้สอน</a></li>
            <li><a href="/classes">ตารางเรียน</a></li>
            <li><a href="/achievements">ข่าวสาร</a></li>
            <li><a href="/prod">การจัดการสินค้า</a></li>
            <li><a href="/order">คำสั่งซื้อ</a></li>
            <li><a href="/activity-logs">ประวัติ</a>
            <li><a href="/login">เข้าสู่ระบบ</a></li>
            <li><a href="/logout">ออกจากระบบ</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>สรุปยอดขายรายเดือน</h2>
    <label for="product-select">เลือกสินค้า:</label>
    <select id="product-select">
        <option value="">ยอดขายทั้งหมด</option>
    </select>

    <canvas id="salesChart" width="400" height="200"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    async function fetchProducts() {
        try {
            const response = await fetch('/api/products');
            const products = await response.json();
            const select = document.getElementById('product-select');

            products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = product.name;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error fetching products:', error);
        }
    }

    async function loadSalesSummary(productId = null) {
        try {
            const url = new URL('/api/orders/sales-summary', window.location.origin);
            if (productId) {
                url.searchParams.append('productId', productId);
            }

            const response = await fetch(url);
            const data = await response.json();

            // Sort data by month to ensure correct order
            data.sort((a, b) => a.month - b.month);

            // Create month labels for all 12 months
            const months = Array.from({length: 12}, (_, i) => `Month ${i + 1}`);
            
            // Map sales data, filling in 0 for months with no sales
            const totalSales = months.map((_, monthIndex) => {
                const monthData = data.find(item => item.month === monthIndex + 1);
                return monthData ? monthData.totalSales : 0;
            });

            const ctx = document.getElementById('salesChart').getContext('2d');
            if (window.salesChartInstance) {
                window.salesChartInstance.destroy();
            }

            window.salesChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [{
                        label: productId ? 'ต่อชิ้น' : 'ยอดรวม',
                        data: totalSales,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'ยอดขาย(บาท)'
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: productId ? 'ยอดขายสินค้าเฉพาะต่อเดือน' : 'ยอดขายสินค้าทั้งหมดต่อเดือน'
                        }
                    }
                }
            });
        } catch (error) {
            console.error('Error loading sales summary:', error);
        }
    }

    document.getElementById('product-select').addEventListener('change', (event) => {
        const productId = event.target.value;
        loadSalesSummary(productId || null);
    });

    window.onload = async function() {
        await fetchProducts();
        loadSalesSummary();
    }
</script>
</body>
</html>
